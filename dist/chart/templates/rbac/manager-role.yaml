apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: gitea-operator-manager-role
rules:
    - apiGroups:
        - core.gitea.com
      resources:
        - gitea
        - gitearepoes
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - core.gitea.com
      resources:
        - gitea/finalizers
        - gitearepoes/finalizers
      verbs:
        - update
    - apiGroups:
        - core.gitea.com
      resources:
        - gitea/status
        - gitearepoes/status
      verbs:
        - get
        - patch
        - update
