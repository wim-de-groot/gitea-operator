{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: gitea-operator
    name: gitea-operator-gitearepo-editor-role
rules:
    - apiGroups:
        - core.gitea.com
      resources:
        - gitearepoes
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - core.gitea.com
      resources:
        - gitearepoes/status
      verbs:
        - get
{{- end }}
