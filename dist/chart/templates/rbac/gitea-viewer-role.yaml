{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: gitea-operator
    name: gitea-operator-gitea-viewer-role
rules:
    - apiGroups:
        - core.gitea.com
      resources:
        - gitea
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - core.gitea.com
      resources:
        - gitea/status
      verbs:
        - get
{{- end }}
